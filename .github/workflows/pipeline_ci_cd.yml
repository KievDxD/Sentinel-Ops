name: Pipeline CI/CD - SENTINEL // OPS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verificar_backend_python:
    name: Pruebas e Integridad Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite de pruebas Pytest
        run: pytest tests

  verificar_frontend_typescript:
    name: Tipado Estricto y Build Frontend (React + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias y compilar producción
        run: |
          npm install
          npm run build

